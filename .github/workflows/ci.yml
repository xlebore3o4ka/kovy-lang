name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-v2-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-v2-

      - name: Install dependencies
        run: nimble install --depsOnly -y

      - name: Run test suite
        run: nimble test --hints:off --warnings:off

  docs:
    name: Documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation checker
        run: nim c --path:src --hints:off --warnings:off -o:"$RUNNER_TEMP/check_docs" scripts/check_docs.nim

      - name: Check documentation
        run: "$RUNNER_TEMP/check_docs"